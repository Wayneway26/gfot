<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AgentSummary</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="AgentSummary 首页"><span class="brand-mark" aria-hidden="true">as</span><span>AgentSummary</span></a>
    <button id="overview" class="nav-home"><span aria-hidden="true">▤</span> 全部任务 <span id="project-count" class="count">0</span></button>
    <div class="nav-label"><span>最近任务</span><button id="new-project" class="icon-button" aria-label="新建任务" title="新建任务">＋</button></div>
    <nav id="projects" aria-label="最近任务"></nav>
    <button id="bridge-settings" class="bridge-settings">WorkBuddy 连接配置</button><footer><span class="local-indicator" aria-hidden="true"></span> 本地工作区<span class="footer-detail">数据仅保存在此设备</span></footer>
  </aside>
  <main>
    <header><span class="breadcrumbs"><span>工作区</span><span class="slash">/</span><span id="breadcrumb">全部任务</span></span><button id="bridge-settings-mobile" class="bridge-mobile">WorkBuddy 连接</button><span class="header-note">任务接力</span></header>
    <div id="view"></div>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
