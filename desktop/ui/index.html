<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>gfot</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="sidebar"><div class="drag titlebar"></div><div class="brand"><span class="brand-icon">g</span><strong>gfot</strong><span class="version">0.3</span></div><button class="new-task" id="new-task"><span>＋</span> 新建任务 <kbd>⌘ N</kbd></button><div class="section-label">本地任务</div><nav id="task-list"></nav><div class="sidebar-bottom"><button id="settings">⚙ <span>模型连接</span><span id="connection-dot" class="dot"></span></button><div class="local-note"><span class="tiny-dot"></span> 保存在这台 Mac 上</div></div></aside>
<main><header class="drag"><div id="breadcrumb">工作区</div><span class="header-label">macOS · 本地优先</span></header><section id="welcome"><div class="welcome-label">YOUR WORK, CONTINUED.</div><h1>一个项目，<br>接着做下去。</h1><p>选一个本地目录，把任务交给 AI。<br>对话、执行过程与模型选择，都在这里。</p><button class="primary" id="welcome-new">选择目录，开始任务 <span>↗</span></button><div class="welcome-footer"><span>01 选择项目</span><span>02 连接模型</span><span>03 查看执行</span></div><div class="release-note">使用自己的 API Key 或本机模型，切换在回合之间进行。</div></section>
<section id="workspace" hidden><div class="task-heading"><div><div class="eyebrow">PROJECT SESSION</div><h1 id="task-title"></h1><button id="folder-label" class="folder-label" title="项目目录"></button></div><span id="status" class="status"></span></div><div class="session-layout"><div class="conversation"><div id="messages" aria-live="polite"></div><div id="approvals"></div><div id="task-error" role="alert"></div><form id="composer"><textarea id="prompt" placeholder="描述你想完成的任务…" rows="3" aria-label="任务消息" required></textarea><div class="composer-tools"><select id="profile-select" aria-label="模型连接"></select><span id="execution-label">OpenCode 执行</span><button id="stop" type="button" hidden>停止</button><button id="send" type="submit" class="send" aria-label="发送消息">↑</button></div></form><p class="composer-note">修改文件与运行命令前会请求批准。模型可以出错，请检查结果。</p></div><aside class="activity"><div class="section-label">执行记录 <span id="event-count">0</span></div><div id="events"></div><div class="activity-note">执行器：OpenCode<br>Harness² 递归改进：尚未启用<br>额度查询 / 自动切换：尚未启用</div></aside></div></section></main>
<dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
