<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>gfot</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar">
  <div class="drag titlebar"></div>
  <button class="brand" id="home" type="button" aria-label="返回工作区首页"><img class="brand-icon" src="/brand-mark.svg" alt="" width="18" height="26"><strong>gfot</strong><span class="brand-caption">Workspace</span></button>
  <button class="new-task" id="new-task"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m13.5 3 3.5 3.5M4 16l3.5-.5L17 6a1.5 1.5 0 0 0-3-3l-9.5 9.5L4 16Z"/></svg><span>新建任务</span><kbd>⌘ N</kbd></button>
  <div class="section-label sidebar-section">项目</div><nav id="task-list" aria-label="项目与任务"></nav>
  <div class="sidebar-bottom">
    <button id="usage" type="button"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7h-7V3Z"/><path d="M13 2v5h5a7 7 0 0 0-5-5Z"/></svg><span>账号与额度</span></button>
    <button id="settings"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="2"/><circle cx="13" cy="10" r="2"/><circle cx="8" cy="15" r="2"/></svg><span>Agent 与连接</span><span id="connection-dot" class="dot" aria-hidden="true"></span></button>
  </div>
</aside>
<main>
  <header class="drag"><div class="header-location"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 3v14"/></svg><div id="breadcrumb">工作区</div></div><span class="header-wordmark">gfot</span></header>
  <section id="welcome">
    <div class="welcome-heading"><img src="/brand-mark.svg" alt="" width="26" height="37"><p class="welcome-label">你的项目，随时继续。</p><h1>今天，想做点什么？</h1><p class="welcome-description">从一个项目开始，把想法一步步变成结果。</p></div>
    <button id="welcome-new" class="project-entry" type="button"><span class="project-entry-icon"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 6V5A1.5 1.5 0 0 1 4 3.5h4L10 6h6A1.5 1.5 0 0 1 17.5 7.5v7A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5V6Z"/><path d="M10 8.5v5M7.5 11h5"/></svg></span><span><strong>打开一个项目</strong><small>选择本地目录，开始新的任务</small></span><svg class="icon entry-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4"/></svg></button>
    <section id="recent-tasks" aria-label="最近任务" hidden></section>
    <p class="welcome-note">切换 Agent，继续同一个任务。上下文和记忆留在这里。</p>
  </section>
  <section id="workspace" hidden>
    <div class="task-heading"><div class="task-identity"><h1 id="task-title"></h1><button id="folder-label" class="folder-label" title="项目目录"></button></div><div class="heading-actions"><button type="button" id="project-notes" title="项目记忆">项目记忆</button><button type="button" id="task-notes" title="任务记忆">任务记忆</button><button id="toggle-details" type="button" aria-expanded="false">任务详情</button><span id="status" class="status"></span></div></div>
    <div class="session-layout"><div class="conversation">
      <div id="messages" aria-live="polite"></div><section id="execution-status" aria-live="polite" hidden></section><div id="approvals"></div><div id="task-error" role="alert"></div>
      <div id="resume-banner" hidden><span id="resume-note"></span><button type="button" id="confirm-native-stopped" hidden>确认旧任务已结束</button><button type="button" id="resume-switch">切换 Agent 继续</button></div>
      <form id="composer"><textarea id="prompt" placeholder="描述任务，或接着说…" rows="3" aria-label="任务消息" required></textarea><div class="composer-tools"><div class="agent-toolbar"><label><span class="sr-only">执行 Agent</span><select id="agent-select" aria-label="执行 Agent"></select></label><select id="profile-select" aria-label="模型与账号连接"></select></div><div class="composer-actions"><span id="execution-label" class="sr-only">OpenCode 执行</span><button type="button" id="switch-agent" title="切换 Agent 并继续当前任务">切换</button><button type="button" id="h2-optimize" title="优化任务执行配置">优化</button><button id="stop" type="button" hidden>停止</button><button id="send" type="submit" class="send" aria-label="发送消息">↑</button></div></div></form>
      <p class="composer-note"><span>工具操作按所选 Agent 的策略审批</span><span class="composer-shortcut">⌘ ↵ 发送</span></p>
    </div><aside class="activity" id="task-details" hidden><section id="handoff-report" hidden></section><section id="h2-report" hidden></section><div class="section-label">执行记录 <span id="event-count">0</span></div><div id="events"></div><div class="activity-note" id="runtime-note"></div></aside></div>
  </section>
</main>
<dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script>
</body></html>
