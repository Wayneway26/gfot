<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>gfot</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="sidebar"><div class="drag titlebar"></div><div class="brand"><img class="brand-icon" src="/brand-mark.svg" alt="" width="31" height="45"><strong>gfot</strong><span class="version">h2</span></div><button class="new-task" id="new-task"><span>＋</span> 新建任务 <kbd>⌘ N</kbd></button><div class="section-label">本地任务</div><nav id="task-list"></nav><div class="sidebar-bottom"><button id="settings"><svg class="settings-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="5" r="2" fill="white" stroke="currentColor" stroke-width="1.4"/><circle cx="13" cy="10" r="2" fill="white" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="15" r="2" fill="white" stroke="currentColor" stroke-width="1.4"/></svg><span>Agent 选择</span><span id="connection-dot" class="dot"></span></button></div></aside>
<main><header class="drag"><div id="breadcrumb">工作区</div></header><section id="welcome"><div class="welcome-intro"><div class="welcome-copy"><div class="welcome-label">ONE PROJECT. KEEP GOING.</div><h1>一个项目，<br><span class="welcome-emphasis">接着做下去。</span></h1><p>选一个本地目录，把任务交给 AI。<br>对话、执行过程与 Agent 选择，都在这里。</p></div><img class="welcome-symbol" src="/brand-mark.svg" alt="" aria-hidden="true" width="132" height="186"></div><button class="primary" id="welcome-new">选择目录，开始任务 <span>↗</span></button><div class="welcome-footer"><span><b>01</b>选择项目</span><span><b>02</b>选择 Agent</span><span><b>03</b>查看执行</span></div><div class="release-note">选择已配置的连接，在回合之间切换。</div></section>
<section id="workspace" hidden><div class="task-heading"><div><div class="eyebrow">PROJECT SESSION</div><h1 id="task-title"></h1><button id="folder-label" class="folder-label" title="项目目录"></button></div><span id="status" class="status"></span></div><div class="session-layout"><div class="conversation"><div id="messages" aria-live="polite"></div><div id="approvals"></div><div id="task-error" role="alert"></div><form id="composer"><textarea id="prompt" placeholder="描述你想完成的任务…" rows="3" aria-label="任务消息" required></textarea><div class="composer-tools"><select id="profile-select" aria-label="Agent 选择"></select><span id="execution-label">OpenCode 执行</span><button type="button" id="h2-optimize">Harness² 优化</button><button id="stop" type="button" hidden>停止</button><button id="send" type="submit" class="send" aria-label="发送消息">↑</button></div></form><p class="composer-note">修改文件与运行命令前会请求批准。模型可以出错，请检查结果。</p></div><aside class="activity"><section id="h2-report" hidden></section><div class="section-label">执行记录 <span id="event-count">0</span></div><div id="events"></div><div class="activity-note">执行器：OpenCode<br>Harness²：可选副本探测<br>额度查询：Codex 导入账号<br>自动切换：尚未启用</div></aside></div></section></main>
<dialog id="dialog"><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
